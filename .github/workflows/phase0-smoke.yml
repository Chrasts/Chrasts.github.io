name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: static validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for file in *.js scripts/*.mjs tests/*.spec.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Validate portfolio model
        run: node scripts/validate-portfolio-model.mjs
      - name: Validate artifact manifest
        run: node scripts/validate-artifacts.mjs
      - name: Validate artifact scenes
        run: node scripts/validate-artifact-scenes.mjs

  product-smoke:
    name: V4 product smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run current product smoke
        run: npx playwright test tests/product-smoke-v4.spec.js
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-product-smoke-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  extended-regression:
    name: extended legacy regression
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit performance architecture
        run: node scripts/validate-performance-contracts.mjs
      - name: Run full historical regression suite
        run: npx playwright test
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-extended-regression-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

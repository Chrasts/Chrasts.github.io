name: Portfolio browser checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          node --check artifact-data.js
          node --check scripts/validate-artifacts.mjs
          node --check scene-system.js
          node --check scene-definitions.js
          node --check scene-legacy-bridge.js
          node --check root-landing.js
          node --check intro-animation.js
          node --check motion-polish.js
          node --check intro-unfold.js
          node --check intro-state-consistency.js
          node --check intro-fixes-v3.js
          node --check radial-geometry.js
          node --check phase7-pointer-hotfix.js
          node --check global-geometry-ownership.js
          node --check graph-transition-prelude.js
          node --check graph-transitions-v6.js
          node --check phase7-atlas.js
          node --check mobile-app.js
          node --check cross-link-travel-v2.js
          node --check phase0-stability.js
          node --check playwright.config.js
          for file in tests/*.spec.js; do node --check "$file"; done

      - name: Validate artifact manifest
        run: node scripts/validate-artifacts.mjs

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1

      - name: Run current-contract smoke tests
        if: github.event_name == 'push'
        run: |
          npx playwright test \
            tests/phase0.spec.js \
            tests/phase0-breakpoint.spec.js \
            tests/phase2-root-landing.spec.js \
            tests/phase6-cross-link.spec.js \
            tests/radial-geometry.spec.js \
            tests/interaction-consolidation.spec.js \
            tests/phase7-atlas-drag.spec.js \
            tests/pre-phase8-mobile.spec.js

      - name: Run full regression suite
        if: github.event_name != 'push'
        run: npx playwright test

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

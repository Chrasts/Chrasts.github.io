name: Portfolio browser smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node --check scene-system.js
          node --check scene-definitions.js
          node --check scene-legacy-bridge.js
          node --check root-landing.js
          node --check intro-animation.js
          node --check motion-polish.js
          node --check intro-unfold.js
          node --check intro-fixes-v3.js
          node --check radial-geometry.js
          node --check phase7-pointer-hotfix.js
          node --check global-geometry-ownership.js
          node --check phase7-atlas.js
          node --check cross-link-travel-v2.js
          node --check phase0-stability.js
          node --check tests/phase0.spec.js
          node --check tests/phase0-breakpoint.spec.js
          node --check tests/phase1-scene.spec.js
          node --check tests/phase2-root-landing.spec.js
          node --check tests/phase3-intro.spec.js
          node --check tests/phase6-cross-link.spec.js
          node --check tests/radial-geometry.spec.js
          node --check tests/motion-polish.spec.js
          node --check tests/intro-unfold.spec.js
          node --check tests/interaction-consolidation.spec.js
          node --check tests/phase7-atlas.spec.js
          node --check tests/phase7-atlas-drag.spec.js

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1

      - name: Run portfolio smoke tests
        run: npx playwright test

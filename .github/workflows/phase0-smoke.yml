name: Portfolio browser checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for file in *.js scripts/*.mjs tests/*.spec.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done

      - name: Validate portfolio model
        run: node scripts/validate-portfolio-model.mjs

      - name: Validate artifact manifest
        run: node scripts/validate-artifacts.mjs

      - name: Validate artifact scenes
        run: node scripts/validate-artifact-scenes.mjs

  browser-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [core, architecture, interactions]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1

      - name: Run core smoke tests
        if: matrix.suite == 'core'
        run: |
          npx playwright test \
            tests/phase0.spec.js \
            tests/phase0-breakpoint.spec.js \
            tests/phase2-root-landing.spec.js \
            tests/radial-geometry.spec.js

      - name: Run architecture smoke tests
        if: matrix.suite == 'architecture'
        run: |
          npx playwright test \
            tests/phase1-scene.spec.js \
            tests/scene-system-contracts.spec.js

      - name: Run interaction smoke tests
        if: matrix.suite == 'interactions'
        run: |
          npx playwright test \
            tests/phase6-cross-link.spec.js \
            tests/interaction-consolidation.spec.js \
            tests/interaction-contracts.spec.js \
            tests/phase7-atlas-drag.spec.js \
            tests/pre-phase8-mobile.spec.js \
            tests/phase8-semantic-scenes.spec.js \
            tests/artifact-scenes.spec.js \
            tests/phase-b-object-focus.spec.js

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.suite }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  full-regression:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1

      - name: Run full regression suite
        run: npx playwright test

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-regression-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
